services:
  - type: web
    name: face-attendance-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: face-attendance-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: DATA_ROOT
        value: /data
      - key: INSIGHTFACE_MODEL
        value: buffalo_sc
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://your-frontend.onrender.com"
      - key: SESSION_SIGNING_SECRET
        generateValue: true
